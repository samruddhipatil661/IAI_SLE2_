<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
<text x="280" y="30" font-size="24" font-family="Arial">BFS and DFS Graph Visualization</text>
<circle cx="400" cy="80" r="25"/><text x="394" y="86">A</text>
<circle cx="250" cy="180" r="25"/><text x="244" y="186">B</text>
<circle cx="550" cy="180" r="25"/><text x="544" y="186">C</text>
<circle cx="170" cy="320" r="25"/><text x="164" y="326">D</text>
<circle cx="330" cy="320" r="25"/><text x="324" y="326">E</text>
<circle cx="470" cy="320" r="25"/><text x="464" y="326">F</text>
<circle cx="630" cy="320" r="25"/><text x="624" y="326">G</text>
<line x1="380" y1="95" x2="270" y2="165" stroke="black"/>
<line x1="420" y1="95" x2="530" y2="165" stroke="black"/>
<line x1="235" y1="200" x2="185" y2="295" stroke="black"/>
<line x1="265" y1="200" x2="315" y2="295" stroke="black"/>
<line x1="535" y1="200" x2="485" y2="295" stroke="black"/>
<line x1="565" y1="200" x2="615" y2="295" stroke="black"/>
<text x="40" y="380" font-size="18">Node A : Start Node (Root)</text>
<text x="40" y="405" font-size="18">Node B : Left Child of A</text>
<text x="40" y="430" font-size="18">Node C : Right Child of A</text>
<text x="420" y="380" font-size="18">Node D : Child of B</text>
<text x="420" y="405" font-size="18">Node E : Child of B</text>
<text x="420" y="430" font-size="18">Node F : Child of C</text>
<text x="420" y="455" font-size="18">Node G : Child of C</text>
<text x="40" y="475" font-size="18">BFS Order: A → B → C → D → E → F → G</text>
<text x="420" y="475" font-size="18">DFS Order: A → B → D → E → C → F → G</text>
</svg>