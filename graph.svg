<circle cx="130" cy="320" r="28" fill="black"/><text x="130" y="328" text-anchor="middle" fill="white" font-size="18">D</text>
<circle cx="310" cy="320" r="28" fill="black"/><text x="310" y="328" text-anchor="middle" fill="white" font-size="18">E</text>
